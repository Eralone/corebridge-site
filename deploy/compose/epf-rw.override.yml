# Временное наложение: том со сборками .epf — на запись для bridge.
#
# ── Зачем ────────────────────────────────────────────────────────────────────
# `POST /api/v1/epf/publish` обслуживает контейнер bridge; он пишет файл через
# fs.mkdir(EPF_BASE_DIR/...) в /opt/corebridge/epf. В docker-compose.yml сервера
# этот том примонтирован как `:ro`, поэтому запись падает. В ответе при этом
# видно `ENOENT: no such file or directory`, а не `EROFS`: рекурсивный mkdir
# в Node сначала делает stat пути, тот честно не находит каталог, и наружу
# уходит именно ENOENT — обманчиво, будто дело в отсутствующем каталоге.
#
# Проверено на живом контейнере:
#   docker exec corebridge-bridge sh -c 'mkdir -p /opt/corebridge/epf/x'
#   → mkdir: can't create directory: Read-only file system
#
# ── Почему наложением, а не правкой компоуза ─────────────────────────────────
# `/opt/corebridge/docker-compose.yml` принадлежит репозиторию corebridge-server
# и приезжает автодеплоем — правка руками там будет молча стёрта. Наложение
# лежит здесь, применяется явной командой и ничего в /opt/corebridge не меняет.
#
# ⚠️ ЭТО ВРЕМЕННО. Постоянное решение — правка в corebridge-server
# (она сделана, но на сервер не доехала; см. Documents/prompts/backend_S16_epf_mount.md).
# Как только деплой сервера её привезёт, наложение станет ненужным: следующий
# штатный `docker compose up` пересоздаст bridge уже с правильным томом.
#
# ── Как применить ────────────────────────────────────────────────────────────
#   docker compose --env-file /opt/corebridge/.env \
#     -f /opt/corebridge/docker-compose.yml \
#     -f /opt/corebridge-site/deploy/compose/epf-rw.override.yml \
#     up -d bridge
#
# Проверить:
#   docker inspect corebridge-bridge \
#     --format '{{range .Mounts}}{{if eq .Destination "/opt/corebridge/epf"}}rw={{.RW}}{{end}}{{end}}'
#
# Откатить — обычным compose без этого файла.
#
# lk-api и nginx намеренно не трогаем: они только читают и раздают, право
# на запись им не нужно.

services:
  bridge:
    volumes:
      - /opt/corebridge/epf:/opt/corebridge/epf:rw
