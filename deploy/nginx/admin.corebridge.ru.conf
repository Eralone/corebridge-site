# ─────────────────────────────────────────────────────────────────────────────
# /etc/nginx/sites-available/admin.corebridge.ru.conf
# Админ-панель CoreBridge — отдельный субдомен.
#
# Источник файла: corebridge-site/deploy/nginx/admin.corebridge.ru.conf
# Это ОБЫЧНЫЙ файл, не симлинк в /opt/corebridge — автодеплой бэкенда его не трогает.
#
#   /admin/*  → 127.0.0.1:3003  (corebridge-admin, Docker) — IP-whitelist + 2FA
#   /         → 127.0.0.1:3005  (next start, route group (admin))
#
# Почему отдельный субдомен: cookie admin_session_id живёт отдельно от lk_session,
# гварды не пересекаются (site_server_integration_reference.md §1).
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.corebridge.ru;

    # Продление сертификата (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
# listen [::]:443 намеренно НЕ указан: nginx слушает 443 только на IPv4.
# Иначе этот server стал бы default-сервером для IPv6:443 и отдавал свой
# сертификат на запросы к api.corebridge.ru.
server {
    listen 443 ssl http2;
    server_name admin.corebridge.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.corebridge.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.corebridge.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Админку не индексируем никогда
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10m;

    # ── /internal/* — ЗАПРЕЩЕНО из интернета (КРИТИЧНО) ──────────────────────
    location /internal/ {
        deny all;
        default_type application/json;
        return 403 '{"error":"forbidden","message":"Internal endpoint"}';
    }

    # ── API админки → corebridge-admin:3003 ─────────────────────────────────
    # IP-whitelist: ОБА адреса Дмитрия из .env (ADMIN_IP_1 и ADMIN_IP_2).
    # В api.corebridge.ru.conf разрешён только второй — тот файл симлинк
    # в /opt/corebridge, править нельзя.
    # IP динамический: при смене доступ отвалится, это ожидаемо.
    location /admin/ {
        allow 109.194.102.43/32;    # ADMIN_IP_1
        allow 188.130.154.24/32;    # ADMIN_IP_2
        allow 127.0.0.1;            # локальные проверки с самого сервера
        allow 10.0.0.0/8;           # Docker internal
        deny all;

        limit_req zone=per_ip burst=10 nodelay;

        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ── Интерфейс админки → Next.js, route group (admin) ────────────────────
    # Сам интерфейс отдаём без IP-фильтра: без admin_session_id он всё равно
    # ничего не покажет, а API за whitelist. Иначе при смене IP не увидеть
    # даже экран логина и непонятно, что происходит.
    location / {
        limit_req zone=per_ip burst=100 nodelay;

        proxy_pass http://127.0.0.1:3005;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Заглушка, пока Next.js не поднят (иначе голый 502 от nginx)
    error_page 502 503 504 /__offline.html;
    location = /__offline.html {
        root /var/www/corebridge-site;
        internal;
        add_header Cache-Control "no-store" always;
    }
}
