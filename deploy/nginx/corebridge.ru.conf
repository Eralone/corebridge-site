# ─────────────────────────────────────────────────────────────────────────────
# /etc/nginx/sites-available/corebridge.ru.conf
# Публичный сайт corebridge.ru + single-origin ЛК (/lk/* → lk-api:3000)
#
# ВАЖНО: файл живёт на хосте (/etc/nginx), а НЕ в /opt/corebridge —
# автодеплой репозитория платформы его не перезапишет.
#
# Порт → сервис:
#   3005 corebridge-site (Next.js, маркетинговый сайт)
#   3000 lk-api          (Личный кабинет; тот же upstream, что и в api.corebridge.ru.conf)
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: ACME challenge + редирект на HTTPS ──────────────────────────────
server {
    listen 80;
    server_name corebridge.ru www.corebridge.ru;

    # ACME http-01 (webroot) — должен идти до любых редиректов
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://corebridge.ru$request_uri;
    }
}

# ── www → apex ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.corebridge.ru;

    ssl_certificate     /etc/letsencrypt/live/corebridge.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corebridge.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://corebridge.ru$request_uri;
}

# ── Основной HTTPS vhost ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name corebridge.ru;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/corebridge.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corebridge.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers.
    # Не подключаем snippets/security-headers.conf: его CSP (script-src 'self')
    # ломает inline-скрипты гидратации Next.js. Остальные заголовки те же.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 10m;

    # ══════════════════════════════════════════════════════════════════════
    # ЛИЧНЫЙ КАБИНЕТ — single-origin: /lk/* → lk-api:3000
    # Сюда ведут ссылки из писем (LK_BASE_URL) и redirect_uri Яндекс ID.
    # ══════════════════════════════════════════════════════════════════════

    # ── /internal/* — ЗАПРЕЩЕНО из интернета (КРИТИЧНО) ───────────────────
    # Дубль правила из api.corebridge.ru.conf. Без него запрос уходил бы в
    # location / на апстрим Next.js, а не отбивался на уровне nginx.
    location /internal/ {
        deny all;
        default_type application/json;
        return 403 '{"error":"forbidden","message":"Internal endpoint"}';
    }

    location = /lk/health {
        access_log off;
        rewrite ^ /health break;
        proxy_pass http://127.0.0.1:3000;
    }

    location /lk/ {
        limit_req zone=per_ip burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ══════════════════════════════════════════════════════════════════════
    # МАРКЕТИНГОВЫЙ САЙТ — всё остальное → Next.js:3005
    # ══════════════════════════════════════════════════════════════════════

    location / {
        limit_req zone=per_ip burst=100 nodelay;

        proxy_pass http://127.0.0.1:3005;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Заглушка, пока Next.js не поднят (иначе голый 502 от nginx)
    error_page 502 503 504 /__offline.html;
    location = /__offline.html {
        root /var/www/corebridge-site;
        internal;
        add_header Cache-Control "no-store" always;
    }
}
