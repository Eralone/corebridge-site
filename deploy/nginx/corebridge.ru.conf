# ─────────────────────────────────────────────────────────────────────────────
# /etc/nginx/sites-available/corebridge.ru.conf
# Публичный сайт corebridge.ru + single-origin ЛК (/lk/* → lk-api:3000)
#
# ВАЖНО: файл живёт на хосте (/etc/nginx), а НЕ в /opt/corebridge —
# автодеплой репозитория платформы его не перезапишет.
#
# Порт → сервис:
#   3005 corebridge-site (Next.js, маркетинговый сайт)
#   3000 lk-api          (Личный кабинет; тот же upstream, что и в api.corebridge.ru.conf)
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: ACME challenge + редирект на HTTPS ──────────────────────────────
server {
    listen 80;
    server_name corebridge.ru www.corebridge.ru;

    # ACME http-01 (webroot) — должен идти до любых редиректов
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://corebridge.ru$request_uri;
    }
}

# ── www → apex ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.corebridge.ru;

    ssl_certificate     /etc/letsencrypt/live/corebridge.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corebridge.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://corebridge.ru$request_uri;
}

# ── Основной HTTPS vhost ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name corebridge.ru;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/corebridge.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corebridge.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers.
    # Не подключаем snippets/security-headers.conf: его CSP (script-src 'self')
    # ломает inline-скрипты гидратации Next.js. Остальные заголовки те же.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 10m;

    # ══════════════════════════════════════════════════════════════════════
    # ЛИЧНЫЙ КАБИНЕТ — single-origin: /lk/* → lk-api:3000
    # Сюда ведут ссылки из писем (LK_BASE_URL) и redirect_uri Яндекс ID.
    # ══════════════════════════════════════════════════════════════════════

    # ── /internal/* — ЗАПРЕЩЕНО из интернета (КРИТИЧНО) ───────────────────
    # Дубль правила из api.corebridge.ru.conf. Без него запрос уходил бы в
    # location / на апстрим Next.js, а не отбивался на уровне nginx.
    location /internal/ {
        deny all;
        default_type application/json;
        return 403 '{"error":"forbidden","message":"Internal endpoint"}';
    }

    location = /lk/health {
        access_log off;
        rewrite ^ /health break;
        proxy_pass http://127.0.0.1:3000;
    }

    # Приглашение в команду — страница сайта, а не API.
    # Сервер шлёт в письме ${LK_BASE_URL}/lk/invite/accept?token=…, но такого
    # маршрута в lk-api нет: ссылка приводила в 404 (проверено). Точное
    # совпадение перебивает префикс /lk/ и отдаёт запрос Next.js, а middleware.ts
    # переписывает путь на /invite/accept. Бэкенд менять не пришлось.
    location = /lk/invite/accept {
        limit_req zone=per_ip burst=20 nodelay;

        proxy_pass http://127.0.0.1:3005;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ══════════════════════════════════════════════════════════════════════
    # API типа 1 — тот, которым пользуется обработка .epf
    #
    # Зарезервирован здесь намеренно: топология проекта — single-origin,
    # и когда в сборку .epf зашьют адрес corebridge.ru, маршрут уже будет.
    # Исторически API отвечал только на api.corebridge.ru; тот vhost — файл
    # сервера (симлинк в /opt/corebridge), править его нельзя, и он остаётся
    # рабочим. Здесь второй вход в те же сервисы, а не замена.
    #
    # ⚠️ ЛОВУШКА, ИЗ-ЗА КОТОРОЙ НЕЛЬЗЯ ПИСАТЬ ОДИН location /api/v1/:
    # префикс обслуживают ДВА разных сервиса. /api/v1/license/* — это
    # license-service:3002, всё остальное — bridge:3001. Один общий блок
    # увёл бы проверку лицензии в bridge, и она отвечала бы 404 —
    # молча и только на этом домене. Порядок блоков ниже воспроизводит
    # api.corebridge.ru.conf; при правках сверяться с ним.
    # ══════════════════════════════════════════════════════════════════════

    # Health license-service. Точное совпадение — до общего /api/v1/license/
    location = /api/v1/license/health {
        access_log off;
        rewrite ^ /health break;
        proxy_pass http://127.0.0.1:3002;
    }

    # Проверка и обновление лицензии — своя, более медленная зона лимитов
    location /api/v1/license/ {
        limit_req zone=license_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ⚠️ Приём колбэков от внешних сервисов остаётся ТОЛЬКО на api.corebridge.ru.
    # Там для них отдельный блок: wildcard CORS и свои лимиты (conf.d/webhooks.conf).
    # Здесь запрос дошёл бы до того же bridge и «работал», но с чужими правилами
    # и вторым адресом, на который никто не подписан. Пусть лучше падает громко:
    # адрес колбэка должен быть один, иначе разбирать инциденты придётся в двух местах.
    location /api/v1/webhooks/ {
        default_type application/json;
        return 404 '{"error":"wrong_host","message":"Webhooks are served at https://api.corebridge.ru/api/v1/webhooks/"}';
    }

    # Остальное API типа 1 → bridge. Зона per_tenant — по заголовку X-Tenant-Id,
    # как на api.corebridge.ru: лимит на клиента, а не на адрес.
    location /api/v1/ {
        limit_req zone=per_tenant burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Сам файл .epf отдаёт nginx, а не bridge: bridge проверяет одноразовый токен
    # и отвечает заголовком X-Accel-Redirect на этот внутренний маршрут. Без него
    # скачивание падало в 404 уже после успешной выдачи токена — токен при этом
    # гасился, и человеку приходилось запрашивать новый. `internal` означает,
    # что снаружи сюда не попасть: только по внутреннему перенаправлению.
    location /cdn/epf-files/ {
        internal;
        alias /opt/corebridge/epf/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "attachment";
    }

    # Раздача файлов .epf. lk-api выдаёт одноразовый токен и адрес вида
    # /cdn/epf/download?token=…, а сам файл отдаёт bridge. Без этого маршрута
    # ссылка вела бы в никуда: в vhost был только /lk/ и /api/v1/.
    location /cdn/ {
        limit_req zone=per_ip burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        # proxy_buffering задан в snippets/proxy-params.conf — второй раз нельзя
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /lk/ {
        limit_req zone=per_ip burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ══════════════════════════════════════════════════════════════════════
    # МАРКЕТИНГОВЫЙ САЙТ — всё остальное → Next.js:3005
    # ══════════════════════════════════════════════════════════════════════

    location / {
        limit_req zone=per_ip burst=100 nodelay;

        proxy_pass http://127.0.0.1:3005;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Заглушка, пока Next.js не поднят (иначе голый 502 от nginx)
    error_page 502 503 504 /__offline.html;
    location = /__offline.html {
        root /var/www/corebridge-site;
        internal;
        add_header Cache-Control "no-store" always;
    }
}
