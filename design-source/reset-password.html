<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый пароль - CoreBridge</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  body { background: var(--bg-alt); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 440px; background: #fff; border-radius: var(--radius-lg); padding: 40px 36px; box-shadow: 0 8px 40px rgba(10,36,99,.08); }
  .auth-card h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
  .auth-card .sub { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 28px; }
  .pwd-strength { display:flex; gap:4px; margin-top:8px; }
  .pwd-strength span { flex:1; height:4px; background: var(--border); border-radius:2px; }
  .pwd-strength.strong span { background: var(--success); }
  .back-link { display: inline-flex; gap: 6px; font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
</style>
</head>
<body>
<main>
  <!-- PAGE: Reset Password -->
  <section class="auth-card">
    <a href="login.html" class="back-link">← Вернуться к входу</a>
    <h1>Новый пароль</h1>
    <p class="sub">Придумайте новый пароль - минимум 8 символов</p>
    <form>
      <div class="field">
        <label for="p1">Новый пароль</label>
        <input id="p1" class="input" type="password" placeholder="Новый пароль" autocomplete="new-password"/>
        <div class="pwd-strength strong" aria-label="Сильный пароль"><span></span><span></span><span></span></div>
      </div>
      <div class="field">
        <label for="p2">Подтвердить пароль</label>
        <input id="p2" class="input" type="password" placeholder="Повторите пароль" autocomplete="new-password"/>
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg">Сохранить пароль</button>
    </form>
  </section>
</main>
</body>
</html>
