<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление пароля - CoreBridge</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  body { background: var(--bg-alt); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 440px; background: #fff; border-radius: var(--radius-lg); padding: 40px 36px; box-shadow: 0 8px 40px rgba(10,36,99,.08); }
  .back-link { display: inline-flex; gap: 6px; font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
  .auth-card h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
  .auth-card .sub { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 28px; }
  .big-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-100); color: var(--blue-500); display:flex; align-items:center; justify-content:center; margin: 0 auto 20px; }
  .big-icon.success { background: var(--success-bg); color: var(--success); }
  .variants { display: grid; grid-template-columns: 1fr; gap: 40px; margin-top: 30px; padding-top: 30px; border-top: 1px dashed var(--border); }
  .variant-label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 12px; letter-spacing: .08em; }
</style>
</head>
<body>
<main>
  <!-- PAGE: Forgot Password (Состояние: ввод email) -->
  <section class="auth-card">
    <a href="login.html" class="back-link">← Вернуться к входу</a>
    <div class="big-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m3 8 9 6 9-6"/></svg>
    </div>
    <h1>Восстановление пароля</h1>
    <p class="sub">Введите email, и мы пришлём ссылку для сброса пароля</p>
    <form>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="your@email.com" autocomplete="email"/>
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg">Отправить инструкции</button>
    </form>

    <!-- PAGE: Forgot Password (Состояние: письмо отправлено) -->
    <div class="variants">
      <div>
        <div class="variant-label">Состояние: письмо отправлено</div>
        <div class="big-icon success">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h1>Проверьте почту</h1>
        <p class="sub">Мы отправили инструкции на <strong style="color:var(--text)">your@email.com</strong>. Ссылка действительна 60 минут.</p>
        <a href="#" class="btn btn-outline btn-block">Открыть почту</a>
        <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px">Не пришло письмо? <a href="#">Отправить повторно</a></p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
